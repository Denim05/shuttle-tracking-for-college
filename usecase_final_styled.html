<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Shuttle Use Case Diagram - Styled</title>
    <!-- Use FontAwesome for System Server only, stick figures for actors -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

      // Enable HTML labels for custom SVGs
      mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });

      // Custom SVG Stick Figure Definition for re-use in labels
      const stickFigure = `<div style="display:flex; flex-direction:column; align-items:center;"><svg width="40" height="70" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" style="background:transparent;"><circle cx="50" cy="20" r="15" stroke="black" stroke-width="5" fill="none"/><line x1="50" y1="35" x2="50" y2="90" stroke="black" stroke-width="5"/><line x1="50" y1="50" x2="10" y2="70" stroke="black" stroke-width="5"/><line x1="50" y1="50" x2="90" y2="70" stroke="black" stroke-width="5"/><line x1="50" y1="90" x2="20" y2="140" stroke="black" stroke-width="5"/><line x1="50" y1="90" x2="80" y2="140" stroke="black" stroke-width="5"/></svg></div>`;

      // SVG System Actor (Stick figure with gear head or distinct color?) Or just reuse stick figure but Red.
      const systemFigure = `<div style="display:flex; flex-direction:column; align-items:center;"><svg width="40" height="70" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" style="background:transparent;"><circle cx="50" cy="20" r="15" stroke="#d32f2f" stroke-width="5" fill="none"/><line x1="50" y1="35" x2="50" y2="90" stroke="#d32f2f" stroke-width="5"/><line x1="50" y1="50" x2="10" y2="70" stroke="#d32f2f" stroke-width="5"/><line x1="50" y1="50" x2="90" y2="70" stroke="#d32f2f" stroke-width="5"/><line x1="50" y1="90" x2="20" y2="140" stroke="#d32f2f" stroke-width="5"/><line x1="50" y1="90" x2="80" y2="140" stroke="#d32f2f" stroke-width="5"/></svg></div>`;

      const graphDefinition = `graph LR
    %% Styles
    classDef actor fill:none,stroke:none,color:#000,font-weight:bold
    classDef systemActor fill:none,stroke:none,color:#d32f2f,font-weight:bold
    classDef blueAction fill:#e3f2fd,stroke:#1565c0,stroke-width:2px,rx:20,ry:20,color:#0d47a1
    classDef greenAction fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,rx:20,ry:20,color:#1b5e20
    classDef yellowAction fill:#fffde7,stroke:#fbc02d,stroke-width:2px,rx:20,ry:20,color:#f57f17
    classDef redAction fill:#ffebee,stroke:#c62828,stroke-width:2px,rx:20,ry:20,color:#b71c1c
    
    %% Actors with Custom SVG Stick Figures
    S["${stickFigure}<br>Student"]:::actor
    D["${stickFigure}<br>Driver"]:::actor
    M["${stickFigure}<br>Manager"]:::actor
    A["${stickFigure}<br>Admin"]:::actor

    %% System Actor on the Right
    Sys["${systemFigure}<br>SYSTEM"]:::systemActor

    subgraph System ["<i class='fa fa-desktop'></i> Campus Shuttle System"]
        direction TB
        
        %% Blue Actions (View/Read)
        UC1(View Live Map):::blueAction
        UC2(Filter Routes):::blueAction
        UC3(View Bus Details):::blueAction
        UC4(Select Bus Stop):::blueAction
        
        %% Green Actions (Core Process/Action)
        UC5(Select Bus to Drive):::greenAction
        UC6(Start Broadcasting):::greenAction
        UC10(Update Bus Status):::greenAction
        UC12(Manage Entities):::greenAction
        
        %% Yellow Actions (Output/Report)
        UC8(View Telemetry):::yellowAction
        UC9(View Fleet Status):::yellowAction
        UC11(View Dashboard Stats):::yellowAction
        UC13(Monitor Live Fleet):::yellowAction
        
        %% Red Actions (System/Critical)
        UC7(Stop Broadcasting):::redAction
        
        %% System Internal Tasks
        UC14(Calculate ETA):::redAction
        UC15(Push Notifications):::redAction
        UC16(Log Activity):::redAction
    end

    %% Connections
    S --- UC1
    S --- UC2
    S --- UC3
    S --- UC4
    
    D --- UC5
    D --- UC6
    D --- UC7
    D --- UC8
    
    M --- UC9
    M --- UC10
    
    A --- UC11
    A --- UC12
    A --- UC13
    
    %% System Connections (Dashed Red Lines)
    UC6 -.-> Sys
    UC7 -.-> Sys
    UC14 -.-> Sys
    UC15 -.-> Sys
    UC16 -.-> Sys
    
    %% Internal Links
    UC6 -.-> UC14
    UC10 -.-> UC15

    %% Style the subgraph border to be dashed and distinct
    style System fill:#fafafa,stroke:#333,stroke-width:2px,stroke-dasharray: 5 5
    linkStyle default stroke-width:1.5px,fill:none,stroke:#555;
`;

      const renderGraph = async () => {
        const element = document.getElementById("mermaid");
        try {
          const { svg } = await mermaid.render("graphDiv", graphDefinition);
          element.innerHTML = svg;

          // Enable download button
          const downloadBtn = document.getElementById("downloadBtn");
          downloadBtn.onclick = () => {
            const blob = new Blob([svg], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "usecase_styled_final.svg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          };
          downloadBtn.style.display = "block";
        } catch (error) {
          element.innerHTML = `<pre style="color:red">Render Error: ${error.message}</pre>`;
          console.error(error);
        }
      };

      renderGraph();
    </script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #fce4ec;
        margin: 0;
      } /* Light pink background like user reference? Or just neutral */
      #mermaid {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
        text-align: center;
      }
      #downloadBtn {
        display: none;
        padding: 12px 24px;
        background-color: #e91e63; /* Pink/Red theme */
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.3s;
      }
      #downloadBtn:hover {
        background-color: #c2185b;
      }
    </style>
  </head>
  <body>
    <div id="mermaid">Loading Diagram...</div>
    <button id="downloadBtn">Download SVG</button>
  </body>
</html>
