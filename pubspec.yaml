name: sistecchalo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.8+23



environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^2.0.3
  flutter_map: ^6.1.0
  google_maps_flutter: ^2.7.0
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^17.1.2
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.1
  firebase_crashlytics: ^4.0.1
  firebase_analytics: ^11.0.1
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon new.png"

flutter_native_splash:
  color: "#0F0F11"
  color_dark: "#0F0F11"
  image: "assets/splash_icon.png"
  image_dark: "assets/splash_icon.png"
  android_12:
    image: "assets/splash_icon.png"
    image_dark: "assets/splash_icon.png"
    icon_background_color: "#0F0F11"
    icon_background_color_dark: "#0F0F11"
    color: "#0F0F11"
    color_dark: "#0F0F11"

flutter:
  uses-material-design: true
  assets:
    - assets/
