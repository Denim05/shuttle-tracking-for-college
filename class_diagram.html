<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Shuttle Class Diagram</title>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

      mermaid.initialize({ startOnLoad: false });

      const graphDefinition = `classDiagram
    class User {
        +String username
        +String password
        +String email
        +String status
        +String[] accessRights
        +Date createdAt
        +login()
        +logout()
        +updateProfile()
    }

    class Student {
        +String name
        +String studentId
        +String pickupPoint
        +String routeId
        +String contactNumber
        +Date createdAt
        +viewMap()
        +filterRoutes()
        +selectBusStop()
    }

    class Driver {
        +String username
        +String password
        +String name
        +String driverId
        +String contactNumber
        +String assignedBusId
        +String status
        +String[] permissions
        +Date createdAt
        +startDriving()
        +stopDriving()
        +updateLocation()
        +viewTelemetry()
    }

    class Manager {
        +String username
        +String password
        +String email
        +String employeeId
        +String department
        +String[] canManage
        +Date createdAt
        +viewFleetStatus()
        +updateBusStatus()
        +generateReports()
    }

    class Admin {
        +String username
        +String password
        +String email
        +String[] permissions
        +Date createdAt
        +viewDashboard()
        +manageUsers()
        +manageRoutes()
    }

    class Bus {
        +String routeId
        +String routeName
        +String routeColor
        +Number currentLat
        +Number currentLng
        +Number heading
        +Number speed
        +String status
        +String driverId
        +Date lastUpdated
        +broadcastLocation()
        +updateStatus()
        +getETA()
    }

    class Route {
        +String name
        +String color
        +Object[] coordinates
        +Object[] stops
        +getPoints()
        +addStop()
    }

    Driver "1" -- "1" Bus : Drives >
    Bus "1" -- "1" Route : Operates On >
    Student "*" -- "1" Route : Assigned To >
    Student "*" -- "1" Bus : Rides >
    Manager ..> Bus : Manages
    Admin ..> User : Manages
`;

      const renderGraph = async () => {
        const element = document.getElementById("mermaid");
        try {
          const { svg } = await mermaid.render("graphDiv", graphDefinition);
          element.innerHTML = svg;

          // Enable download button
          const downloadBtn = document.getElementById("downloadBtn");
          downloadBtn.onclick = () => {
            const blob = new Blob([svg], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "class_diagram.svg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          };
          downloadBtn.style.display = "block";
        } catch (error) {
          element.innerHTML = `<pre style="color:red">Render Error: ${error.message}</pre>`;
          console.error(error);
        }
      };

      renderGraph();
    </script>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f4;
        margin: 0;
      }
      #mermaid {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      #downloadBtn {
        display: none;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      #downloadBtn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div id="mermaid">Loading Class Diagram...</div>
    <button id="downloadBtn">Download SVG</button>
  </body>
</html>
