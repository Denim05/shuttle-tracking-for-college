<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Shuttle Use Case Diagram</title>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

      mermaid.initialize({ startOnLoad: false });

      // Using "graph LR" (Flowchart) syntax which is the most robust and widely supported
      // This simulates a Use Case diagram effectively
      const graphDefinition = `graph LR
    subgraph Actors
        S[Student]
        D[Driver]
        M[Manager]
        A[Admin]
    end

    subgraph "Campus Shuttle System"
        UC1(View Live Map)
        UC2(Filter Routes)
        UC3(View Bus Details)
        UC4(Select Bus Stop)
        UC5(Select Bus to Drive)
        UC6(Start Broadcasting Location)
        UC7(Stop Broadcasting)
        UC8(View Telemetry)
        UC9(View Fleet Status)
        UC10(Update Bus Status)
        UC11(View Dashboard Stats)
        UC12(Manage Entities)
        UC13(Monitor Live Fleet)
    end

    S --> UC1
    S --> UC2
    S --> UC3
    S --> UC4

    D --> UC5
    D --> UC6
    D --> UC7
    D --> UC8

    M --> UC9
    M --> UC10

    A --> UC11
    A --> UC12
    A --> UC13
    A -.->|Inherits| M

    style S fill:#f9f,stroke:#333,stroke-width:2px
    style D fill:#ccf,stroke:#333,stroke-width:2px
    style M fill:#ff9,stroke:#333,stroke-width:2px
    style A fill:#f99,stroke:#333,stroke-width:2px
`;

      const renderGraph = async () => {
        const element = document.getElementById("mermaid");
        try {
          const { svg } = await mermaid.render("graphDiv", graphDefinition);
          element.innerHTML = svg;
        } catch (error) {
          element.innerHTML = `<pre style="color:red">Render Error: ${error.message}</pre>`;
          console.error(error);
        }
      };

      renderGraph();
    </script>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f4;
        margin: 0;
      }
      #mermaid {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="mermaid">Loading Diagram...</div>
  </body>
</html>
