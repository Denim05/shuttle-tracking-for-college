<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Shuttle Use Case Diagram - Advanced</title>
    <!-- FontAwesome for the 'human modal' icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

      // Enable HTML labels for FontAwesome
      mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });

      const graphDefinition = `graph LR
    %% Styles
    classDef actor fill:#fff,stroke:#333,stroke-width:2px,color:#000
    classDef systemActor fill:#ffebee,stroke:#d32f2f,stroke-width:2px,color:#d32f2f
    classDef blueAction fill:#fff,stroke:#4b6cb7,stroke-width:2px,color:#000
    classDef greenAction fill:#fff,stroke:#2dce89,stroke-width:2px,color:#000
    classDef yellowAction fill:#fff,stroke:#fbbc05,stroke-width:2px,color:#000
    classDef redAction fill:#fff,stroke:#f5365c,stroke-width:2px,color:#000
    
    %% Actors with FontAwesome Icons
    S["<i class='fa fa-user fa-3x'></i><br><b>Student</b>"]:::actor
    D["<i class='fa fa-id-card fa-3x'></i><br><b>Driver</b>"]:::actor
    M["<i class='fa fa-user-tie fa-3x'></i><br><b>Manager</b>"]:::actor
    A["<i class='fa fa-user-gear fa-3x'></i><br><b>Admin</b>"]:::actor

    %% System Actor on the Right
    Sys["<i class='fa fa-server fa-3x'></i><br><b>SYSTEM</b>"]:::systemActor

    subgraph System ["<i class='fa fa-desktop'></i> Campus Shuttle System"]
        direction TB
        
        %% Blue Actions (View/Read)
        UC1([View Live Map]):::blueAction
        UC2([Filter Routes]):::blueAction
        UC3([View Bus Details]):::blueAction
        UC4([Select Bus Stop]):::blueAction
        
        %% Green Actions (Core Process/Action)
        UC5([Select Bus to Drive]):::greenAction
        UC6([Start Broadcasting]):::greenAction
        UC10([Update Bus Status]):::greenAction
        UC12([Manage Entities]):::greenAction
        
        %% Yellow Actions (Output/Report)
        UC8([View Telemetry]):::yellowAction
        UC9([View Fleet Status]):::yellowAction
        UC11([View Dashboard Stats]):::yellowAction
        UC13([Monitor Live Fleet]):::yellowAction
        
        %% Red Actions (System/Critical)
        UC7([Stop Broadcasting]):::redAction
        
        %% System Internal Tasks
        UC14([Calculate ETA]):::redAction
        UC15([Push Notifications]):::redAction
        UC16([Log Activity]):::redAction
    end

    %% Connections
    S --- UC1
    S --- UC2
    S --- UC3
    S --- UC4
    
    D --- UC5
    D --- UC6
    D --- UC7
    D --- UC8
    
    M --- UC9
    M --- UC10
    
    A --- UC11
    A --- UC12
    A --- UC13
    
    %% System Connections (Dashed Red Lines)
    UC6 -.-> Sys
    UC7 -.-> Sys
    UC14 -.-> Sys
    UC15 -.-> Sys
    UC16 -.-> Sys
    
    %% Internal Links
    UC6 -.-> UC14
    UC10 -.-> UC15

    %% Style the subgraph border to be dashed and blue-ish like the reference
    style System fill:#fff,stroke:#333,stroke-width:2px,stroke-dasharray: 5 5
    linkStyle default stroke-width:2px,fill:none,stroke:#666;
`;

      const renderGraph = async () => {
        const element = document.getElementById("mermaid");
        try {
          const { svg } = await mermaid.render("graphDiv", graphDefinition);
          element.innerHTML = svg;

          // Enable download button
          const downloadBtn = document.getElementById("downloadBtn");
          downloadBtn.onclick = () => {
            const blob = new Blob([svg], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "usecase_diagram.svg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          };
          downloadBtn.style.display = "block";
        } catch (error) {
          element.innerHTML = `<pre style="color:red">Render Error: ${error.message}</pre>`;
          console.error(error);
        }
      };

      renderGraph();
    </script>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f4;
        margin: 0;
      }
      #mermaid {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      #downloadBtn {
        display: none;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      #downloadBtn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div id="mermaid">Loading Advanced Diagram...</div>
    <button id="downloadBtn">Download SVG</button>
  </body>
</html>
