name: Render 100% Free Keep-Alive Pinger

on:
  schedule:
    # Run every 5 minutes 24/7/365 to prevent Render 15-minute sleep
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-render-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "🏓 Pinging Render backend to keep server 100% awake..."
          curl -s -f --max-time 45 -I https://smart-shuttle-backend-2h13.onrender.com/api/health || echo "⚠️ Health ping sent"
          curl -s -f --max-time 45 -I https://smart-shuttle-backend-2h13.onrender.com/ || echo "⚠️ Root ping sent"
